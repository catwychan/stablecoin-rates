name: Refresh rates and publish

on:
  schedule:
    # Once a day at 14:30 UTC (9:30 US Eastern, 10:30 in summer), after the day's SOFR is out.
    # GitHub skips some scheduled runs, so the two later slots are retries: they do nothing once today's refresh has run.
    - cron: "30 14 * * *"
    - cron: "30 16 * * *"
    - cron: "30 19 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ["last_run.txt", "README.md"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      done: ${{ steps.today.outputs.done }}
    steps:
      - uses: actions/checkout@v4
      - id: today
        name: Has today's refresh already run?
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] \
             && [ "$(cut -c1-10 last_run.txt 2>/dev/null)" = "$(date -u +%F)" ] \
             && [ "$(cut -c12-13 last_run.txt)" -ge 14 ]; then
            echo "done=true" >> "$GITHUB_OUTPUT"
            echo "Already refreshed today at $(cat last_run.txt) - nothing to do."
          fi

  publish:
    needs: gate
    if: needs.gate.outputs.done != 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Fetch rates
        run: |
          python3 fetch_rates.py | tee run.log
          if grep -q '^FAILED' run.log; then
            echo "A data source failed - keeping the previously published data."
            exit 1
          fi
      - name: Assemble site
        run: |
          mkdir _site
          cp index.html rates.json history.json _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
      - name: Record the run (the retry slots check this)
        continue-on-error: true
        run: |
          date -u +%Y-%m-%dT%H:%M:%SZ > last_run.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add last_run.txt
          git commit -m "Refresh $(cat last_run.txt)" && git push
